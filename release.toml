# cargo-release configuration
# See https://github.com/crate-ci/cargo-release

[workspace]
# Use v-prefixed tags like v0.1.5
tag-name = "v{{version}}"
tag-message = "Release {{version}}"
# Push the commit and tag after release
push = true
# Don't run cargo publish; this project produces a .so, not a crate
publish = false
# Use a single commit for the release
shared-version = true
# Allow the working tree to be non-clean if needed (cargo-release will still work)
allow-branch = ["main"]
# Don't depend on registry
no-dev-version = false
