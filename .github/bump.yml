# .github/bump.yml
# configuration of MeilCli/bump-release-action
---
release:
  title-prefix: 'v'
  initial-version: '0.1.0'
  tag-prefix: 'v'
  pull-request-commit: 'include'
branch:
  base-branch: 'main'
  version-branch-prefix: 'v'
  bump-version-commit-prefix: 'v'
categories:
  - title: 'Changes'
    commits:
      - ''
files:
  - file-path: 'Cargo.toml'
    line: 12
