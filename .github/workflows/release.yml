name: Release

on:
  workflow_dispatch:
    branches: [main]
    inputs:
      bump-type:
        description: 'Bump type'
        required: true
        default: 'patch'
        type: choice
        options:
        - major
        - minor
        - patch
      dry_run:
        description: 'dry run, true or false'
        default: false
        type: boolean
      draft:
        description: 'draft, true or false'
        default: false
        type: boolean
      pre_release:
        description: 'pre release, true or false'
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Find CI run for HEAD
        id: find_ci
        uses: actions/github-script@v9
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              head_sha: context.sha,
              head_branch: 'main',
              event: 'push',
              status: 'success',
              conclusion: 'success',
              per_page: 100,
            });
            for (const run of runs.workflow_runs) {
              core.info(`CI run #${run.id}: ${run.display_title} <${run.html_url}>`);
            }
            const run = runs.workflow_runs[0];
            if (!run) throw new Error('No successful CI run on main for ' + context.sha);
            if (runs.workflow_runs.length > 1) throw new Error('Multiple CI runs match ' + context.sha + ' on main');
            if (run.head_sha !== context.sha) throw new Error('CI run SHA mismatch: ' + run.head_sha);
            if (run.head_branch !== 'main') throw new Error('CI run not on main: ' + run.head_branch);
            if (run.conclusion !== 'success') throw new Error('CI run not successful: ' + run.conclusion);

            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
            });
            const matching = artifacts.artifacts.filter(a => a.name === 'L_builtin-artifacts' && !a.expired);
            if (matching.length < 1) {
              throw new Error('L_builtin-artifacts not found in CI run ' + run.id);
            }
            core.info(`CI run ${run.id} has ${matching.length} L_builtin-artifacts artifact(s)`);

            core.setOutput('run_id', String(run.id));

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install bump-my-version
        shell: bash
        run: pip install "bump-my-version==1.5.1"

      - name: Configure git
        run: |
          set -x
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git config --global init.defaultBranch main

      - name: Bump version
        if: github.ref == 'refs/heads/main'
        id: bump
        run: |
          set -x
          echo "previous-version=$(bump-my-version show current_version)" >> "$GITHUB_OUTPUT"
          bump-my-version bump ${{ inputs.'bump-type' }}
          echo "current-version=$(bump-my-version show current_version)" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        if: github.ref == 'refs/heads/main'
        id: notes
        run: |
          set -euo pipefail
          if [ -z "${{ steps.bump.outputs.previous-version }}" ]; then
            scripts/generate-release-notes.sh v${{ steps.bump.outputs.current-version }} | tee release_notes.md
          else
            scripts/generate-release-notes.sh v${{ steps.bump.outputs.current-version }} v${{ steps.bump.outputs.previous-version }} | tee release_notes.md
          fi

      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v4

      - name: Build and output artifacts
        if: github.ref == 'refs/heads/main'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: build-output
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=local,dest=/tmp/build-output
          provenance: false

      - name: Push commit and tag
        if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
        run: |
          set -x
          git push origin HEAD "v${{ steps.bump.outputs.current-version }}"

      - name: Create GitHub release and attach artifacts
        if: ${{ !inputs.dry_run && github.ref == 'refs/heads/main' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.bump.outputs.current-version }}
          name: Release v${{ steps.bump.outputs.current-version }}
          body_path: release_notes.md
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.pre_release }}
          files: /tmp/build-output/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}