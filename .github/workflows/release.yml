name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'bump type, major or minor or patch or empty string'
        default: ''
        type: string
      dry_run:
        description: 'dry run, true or false'
        default: 'false'
        type: string
      draft:
        description: 'draft, true or false'
        default: 'false'
        type: string
      pre_release:
        description: 'pre release, true or false'
        default: 'false'
        type: string

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Find CI run for HEAD
        id: find_ci
        uses: actions/github-script@v9
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              head_sha: context.sha,
              head_branch: 'main',
              event: 'push',
              status: 'success',
              conclusion: 'success',
            });
            const run = runs.workflow_runs[0];
            if (!run) throw new Error('No successful CI run on main for ' + context.sha);
            if (runs.workflow_runs.length > 1) throw new Error('Multiple CI runs match ' + context.sha + ' on main');
            if (run.head_sha !== context.sha) throw new Error('CI run SHA mismatch: ' + run.head_sha);
            if (run.head_branch !== 'main') throw new Error('CI run not on main: ' + run.head_branch);
            if (run.conclusion !== 'success') throw new Error('CI run not successful: ' + run.conclusion);

            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
            });
            const artifact = artifacts.artifacts.find(a => a.name === 'L_builtin-artifacts' && !a.expired);
            if (!artifact) throw new Error('L_builtin-artifacts not found in CI run ' + run.id);

            core.setOutput('run_id', String(run.id));

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: L_builtin-artifacts
          path: /tmp/build-output
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find_ci.outputs.run_id }}

      - name: Bump version and create release
        id: create_release
        uses: MeilCli/bump-release-action@v3.0.10
        with:
          config_path: '.github/bump.yml'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          bump: ${{ inputs.bump }}
          dry_run: ${{ inputs.dry_run }}
          draft: ${{ inputs.draft }}
          pre_release: ${{ inputs.pre_release }}
          commit_user: ${{ github.actor }}
          commit_email: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com

      - name: Upload L_builtin.so artifacts
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ fromJSON(steps.create_release.outputs.release).tag_name }}
          files: /tmp/build-output/**