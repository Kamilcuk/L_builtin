# .github/workflows/release.yml:
name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'bump type, major or minor or patch or empty string'
        default: ''
      dry_run:
        description: 'dry run, true or false'
        default: 'false'
      draft:
        description: 'draft, true or false'
        default: 'false'
      pre_release:
        description: 'pre release, true or false'
        default: 'false'
jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, Test, Output
        uses: docker/build-push-action@v7
        with:
          context: .
          target: output
          push: false
          build-args: |
            BASHES=5.3
            MAKEARGS=
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=local,dest=dist
      - name: Verify release assets
        run: ls -la dist/L_builtin-*.so
      - uses: MeilCli/bump-release-action@v3.0.8
        id: create_release
        with:
          config_path: '.github/bump.yml'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          bump: ${{ github.event.inputs.bump }}
          dry_run: ${{ github.event.inputs.dry_run }}
          draft: ${{ github.event.inputs.draft }}
          pre_release: ${{ github.event.inputs.pre_release }}
          commit_user: ${{ github.actor }}
          commit_email: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          files: dist/L_builtin-*.so
          tag_name: ${{ fromJSON(steps.create_release.outputs.release).tag_name }}
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
