name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RUST_VERSION: "1.70"

jobs:
  build-and-test:
    name: Build and Test (Bash ${{ matrix.bash_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 3
      matrix:
        # Order: most widely used / important first for fast feedback
        bash_version: [5.3, 5.0]
        # Commented out versions:
        # bash_version: [5.2, 5.1, 4.4, 4.3, 4.2, 4.1, 4.0, 3.2]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            clang \
            clang-format \
            clang-tidy \
            cppcheck \
            libreadline-dev \
            git \
            curl \
            wget \
            make \
            gcc \
            bison \
            yacc \
            libncurses5-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Clone Bash source repository
        run: |
          mkdir -p tmp
          if [ ! -d tmp/bash ]; then
            git clone --bare https://git.savannah.gnu.org/git/bash.git tmp/bash
          fi

      - name: Compile Bash ${{ matrix.bash_version }}
        run: |
          ./bash.sh ${{ matrix.bash_version }} compile

      - name: Build builtin against Bash ${{ matrix.bash_version }}
        run: |
          make build B="build/${{ matrix.bash_version }}" BASH_INC="build/bash-${{ matrix.bash_version }}" BASH="build/bash-${{ matrix.bash_version }}/bash"

      - name: Run tests with Bash ${{ matrix.bash_version }}
        run: |
          make test B="build/${{ matrix.bash_version }}" BASH_INC="build/bash-${{ matrix.bash_version }}" BASH="build/bash-${{ matrix.bash_version }}/bash"

      - name: Check code formatting
        run: make check-format

      - name: Run clang-tidy
        run: make tidy

      - name: Run cppcheck
        run: make cppcheck

      - name: Verify module loads
        run: |
          build/bash-${{ matrix.bash_version }}/bash --init-file <(echo 'enable -f ./build/${{ matrix.bash_version }}/L_builtin.so L_builtin') -c 'L_builtin --help'

  rust-checks:
    name: Rust Checks (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --all-features

  publish:
    name: Publish Release (Bash ${{ matrix.bash_version }})
    needs: [build-and-test, rust-checks]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        bash_version: [5.3, 5.0]
        # Commented out versions:
        # bash_version: [5.2, 5.1, 4.4, 4.3, 4.2, 4.1, 4.0, 3.2]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            clang \
            libreadline-dev \
            git \
            curl \
            wget \
            make \
            gcc \
            bison \
            yacc \
            libncurses5-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Clone Bash source repository
        run: |
          mkdir -p tmp
          if [ ! -d tmp/bash ]; then
            git clone --bare https://git.savannah.gnu.org/git/bash.git tmp/bash
          fi

      - name: Compile Bash ${{ matrix.bash_version }}
        run: |
          ./bash.sh ${{ matrix.bash_version }} compile

      - name: Build release for Bash ${{ matrix.bash_version }}
        run: |
          make release B="build/${{ matrix.bash_version }}" BASH_INC="build/bash-${{ matrix.bash_version }}" BASH="build/bash-${{ matrix.bash_version }}/bash"

      - name: Create release archive for Bash ${{ matrix.bash_version }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mkdir -p dist
          cp "build/${{ matrix.bash_version }}/L_builtin.so" "dist/L_builtin-${VERSION}-linux-x86_64-bash-${{ matrix.bash_version }}.so"
          cd dist && sha256sum * > SHA256SUMS

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}